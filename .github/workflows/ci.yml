name: OpenAPE offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.lock
      - run: pip install --no-deps --no-build-isolation -e .
      - run: bash scripts/check_all.sh
      - run: python -m scripts.offline_smoke
      - run: npm --prefix .host-test install --no-audit --no-fund @earendil-works/pi-coding-agent@1.3.0
      - run: python -m scripts.real_host_smoke
