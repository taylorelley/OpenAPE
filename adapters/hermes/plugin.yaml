name: openape
version: "0.3.0"
description: "Experimental OpenAPE (UPAP/2) style context appended to the current user message. Coexists with SOUL.md; never edits it."
requires_env:
  - OPENAPE_TOKEN
  - OPENAPE_PERSONA
provides_tools:
  - persona_feedback
hooks:
  - subagent_start
  - post_tool_call
  - pre_llm_call
  - post_llm_call
  - on_session_end
