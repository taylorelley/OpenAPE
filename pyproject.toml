[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"
[project]
name = "openape"
version = "0.3.0"
description = "OpenAPE — Agent Personality Engine; experimental UPAP implementation"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3", "torch>=2.5,<3", "safetensors>=0.4,<1", "httpx>=0.27,<1", "numpy>=2,<3"]
[project.optional-dependencies]
test = ["pytest>=8,<10"]
# Live-model evaluation harness (benchmarks/live): Claude via the official anthropic SDK,
# other providers and gateways via the official openai SDK (any OpenAI-compatible endpoint).
live = ["anthropic>=1.17,<2", "openai>=3.37,<4"]
[project.scripts]
openape = "sdk.cli.main:main"
[tool.setuptools.packages.find]
include = ["engine*", "sdk*", "protocol*", "models*"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.package-data]
models = ["decoder-v3/*.safetensors", "decoder-v3/*.json", "decoder-v3/MODEL_CARD.md"]
sdk = ["cli/dashboard.html"]
protocol = ["upap/v2/*.json"]
